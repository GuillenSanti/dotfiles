name: validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  installation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Check shell syntax
        run: |
          zsh -n install.sh zsh/zshrc zsh/santi.zsh-theme
          bash -n hosts/update-hosts.sh tmux/attention.sh tmux/status/battery.sh tmux/status/caffeinate.sh
      - name: Run isolated installation tests
        run: python -m unittest discover -s tests -v
