# Use 256 colors + truecolor when possible
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Let tmux recognize more key combinations (helps on macOS Terminal)
set -g xterm-keys on

# Shift+Enter support
set -s extended-keys on
set -as terminal-features ",xterm-256color:extkeys"

# OSC 8 hyperlinks (the links in ~/.tmux/dash.py); applies to newly attached clients
set -as terminal-features ",xterm-256color:hyperlinks"

# Bigger scrollback history
set -g history-limit 100000

# Enable mouse: click to focus panes, drag to resize, wheel to scroll
set -g mouse on

# Start window/pane numbering at 1 (more natural than 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Remove delay after pressing Esc (useful for vim)
set -s escape-time 0

# Let vim/nvim detect focus events between panes
set -g focus-events on

# Quick reload of this config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Review a PR from any window: asks which one, then opens its review window (deck/pr_review.py)
bind R display-popup -E -w 80 -h 10 -T " review a PR " "/usr/bin/python3 ~/.tmux/pr_review.py --ask"

# Split panes and keep the current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Pane navigation without prefix (avoid Option+Arrow because Terminal uses it for word jumps)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane resize without prefix
bind -n M-S-h resize-pane -L 5
bind -n M-S-j resize-pane -D 2
bind -n M-S-k resize-pane -U 2
bind -n M-S-l resize-pane -R 5

# Status bar: top position, minimal dark style
set -g status-position top
# The status scripts run this often; @attention and cafe-on/cafe-off redraw it at once
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour248"
set -g status-left "#{?client_prefix,#[bg=colour252#,fg=colour235#,bold] ● ,#[bg=colour235#,fg=colour240] ● }#{?mouse,#[bg=colour235#,fg=colour248] 󰍽 ,#[bg=colour235#,fg=colour240] 󰍽 }#{?pane_in_mode,#[bg=colour235#,fg=colour248] 󰅇 ,}"
set -g status-left-length 20
set -g status-right "#[bg=colour235,fg=colour248]#(~/.tmux/caffeinate.sh)#(~/.tmux/battery.sh)  %a %d %b  %H:%M [#{window_index}/#{session_windows}]"
set -gw window-status-format "#[bg=colour235,fg=colour243] #{window_index}:#{window_name}#{?@attention, #{@attention},#{?window_bell_flag, 󰂞,}} "
set -gw window-status-current-format "#[bg=colour237,fg=colour252,bold] #{window_index}:#{window_name}#{?window_zoomed_flag, 󰁌,} "

# Attention icon: @attention (set by ~/.tmux/attention.sh from Claude Code,
# opencode and zsh) or a terminal bell from anything else; visiting clears both
set-hook -g session-window-changed 'set -wu @attention'
set -gw window-status-bell-style default

# Pane borders: minimal dark style
set -g pane-border-style "fg=colour235"
set -g pane-active-border-style "fg=colour240"

# Message style: minimal dark (no default yellow)
set -g message-style "bg=colour237,fg=colour252"
set -g message-command-style "bg=colour237,fg=colour252"

# Mode style (selection in copy-mode): minimal dark
set -gw mode-style "bg=colour240,fg=colour252"

# Toggle mouse mode
bind m set -g mouse \; display-message "mouse #{?mouse,on,off}"

# Copy-mode toggle with prefix + [
bind '[' if-shell -F '#{pane_in_mode}' 'send -X cancel' 'copy-mode'

# Copy-mode keybindings (vi-style)
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'Enter' send -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'Escape' send -X cancel

# Command prompt styling
set -g message-command-style "fg=colour248,bg=colour235"
